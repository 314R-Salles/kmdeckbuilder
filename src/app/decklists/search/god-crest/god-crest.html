<div class="godCrest" [class.godCrest--fixed]="!allowResize()">

    <img class="deckImgGod" [src]="'/assets/public/gods/GOD_' + god() + '.png'"/>
  }
  <div class="badgePA">
    <img class="paIcon" [src]="'/assets/public/picto-PA.png'"/>
    <div class="costAP">{{ costAP() }}</div>
  </div>
</div>
