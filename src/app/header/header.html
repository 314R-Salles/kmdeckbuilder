<div class="header-menu">
  <div class="header-inner">
    <div class="header-left">
      <button type="button" class="hamburger-btn" [class.open]="menuOpen()" (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <span class="logo-button" routerLink="home" (click)="closeMenu()">KMTOOLS</span>
    </div>

    <nav class="nav-links" [class.open]="menuOpen()">
      <span class="library-button" routerLink="/decks/browse" routerLinkActive="active"
            (click)="closeMenu()">Decks</span>
      <span class="library-button" routerLink="/media" routerLinkActive="active" (click)="closeMenu()">Media</span>
      <span class="library-button" routerLink="/draft" routerLinkActive="active"
            (click)="closeMenu()">CreateDraft</span>

      @if (isAdmin()) {
        <span class="dropdown-button library-button"
              routerLinkActive="active" [matMenuTriggerFor]="admin">Admin</span>
      }

      <mat-menu #admin="matMenu">
        <!--          <button mat-menu-item [matMenuTriggerFor]="menu1">News</button>-->
        <button mat-menu-item routerLink="tags/edit" (click)="closeMenu()">Tags</button>
        <button mat-menu-item>Videos (TODO)</button>
        <button mat-menu-item>Users (TODO)</button>
      </mat-menu>
    </nav>

    <div class="nav-actions">
      @if (!user()) {
        <div class="headerBtn" (click)="login()">
          <span style="align-self: center;">{{ 'login.button' | translate }}</span>
        </div>
      } @else {
        <div class="headerBtn" [routerLink]="['/user', user().username ]" (click)="closeMenu()">
          <span style="align-self: center;">{{ user().username }}</span>
        </div>
      }
      <a href="https://discord.gg/kMEKgxtMS6" target="_blank" class="headerBtn discord-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-discord"
             viewBox="0 0 16 16">
          <path
            d="M13.545 2.907a13.2 13.2 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.2 12.2 0 0 0-3.658 0 8 8 0 0 0-.412-.833.05.05 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.04.04 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032q.003.022.021.037a13.3 13.3 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019q.463-.63.818-1.329a.05.05 0 0 0-.01-.059l-.018-.011a9 9 0 0 1-1.248-.595.05.05 0 0 1-.02-.066l.015-.019q.127-.095.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .053.007q.121.1.248.195a.05.05 0 0 1-.004.085 8 8 0 0 1-1.249.594.05.05 0 0 0-.03.03.05.05 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.2 13.2 0 0 0 4.001-2.02.05.05 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.03.03 0 0 0-.02-.019m-8.198 7.307c-.789 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612m5.316 0c-.788 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612"/>
        </svg>
      </a>
      <app-language-dropdown/>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="menu-backdrop" (click)="closeMenu()"></div>
  }
</div>
